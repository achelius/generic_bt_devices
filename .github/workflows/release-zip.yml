name: Release Custom Component Zip

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create component zip
        run: |
          cd custom_components/gate_controller
          zip -r ../../gate_controller.zip .

      - name: Create GitHub Release with zip
        uses: softprops/action-gh-release@v2
        with:
          files: gate_controller.zip
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
